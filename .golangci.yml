version: "2"
linters:
  disable:
    - errcheck
  exclusions:
    rules:
      # staticcheck style nits we don't want to chase
      - linters: [staticcheck]
        text: "QF1003"
      - linters: [staticcheck]
        text: "S1017"
      - linters: [staticcheck]
        text: "QF1001"
      - linters: [staticcheck]
        text: "S1009"
      # testing.T.Fatal/Fatalf terminates the test goroutine, but Staticcheck
      # does not model that control flow and reports false nil dereferences.
      - path: '.*_test\.go'
        linters: [staticcheck]
        text: "possible nil pointer dereference|this check suggests that the pointer can be nil"
